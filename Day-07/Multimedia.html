<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Multimedia Project</title>
</head>
<body>

    <h1>HTML5 Multimedia Project</h1>

    <hr>

    <h2>Audio Example</h2>

    <audio controls>
        <source src="audio/sample.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <hr>

    <h2>Video Example</h2>

    <video controls width="500">
        <source src="video/sample.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <hr>

    <h2>YouTube Video</h2>

    <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/49_4UcmCvpM"
        title="YouTube Video"
        allowfullscreen>
    </iframe>

    <hr>

    <h2>Google Map</h2>

    <iframe
        src="https://www.google.com/maps?q=Tanuku&output=embed"
        width="600"
        height="450"
        style="border:0;">
    </iframe>

</body>
</html>
