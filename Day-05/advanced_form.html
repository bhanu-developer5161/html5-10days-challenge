<!DOCTYPE html>
<html lang="en">

<head>
    <title>Advanced Registration Form</title>
</head>

<body>

    <h1>Advanced Student Registration Form</h1>

    <form action="#" method="post">

        <fieldset>
            <legend>Personal Information</legend>

            <label for="name">Full Name:</label><br>
            <input 
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required>
            <br><br>


            <label for="email">Email:</label><br>
            <input 
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required>
            <br><br>


            <label for="password">Password:</label><br>
            <input 
                type="password"
                id="password"
                name="password"
                minlength="8"
                placeholder="Minimum 8 characters"
                required>

        </fieldset>


        <br>


        <fieldset>
            <legend>Additional Details</legend>


            <label for="age">Age:</label><br>
            <input 
                type="number"
                id="age"
                name="age"
                min="18"
                max="60"
                placeholder="Enter your age">
            <br><br>


            <label for="dob">Date of Birth:</label><br>
            <input 
                type="date"
                id="dob"
                name="dob">
            <br><br>


            <label for="time">Preferred Time:</label><br>
            <input 
                type="time"
                id="time"
                name="time">
            <br><br>


            <label for="color">Favorite Color:</label><br>
            <input 
                type="color"
                id="color"
                name="color">
            <br><br>


            <label for="skill">Skill Level:</label><br>
            <input 
                type="range"
                id="skill"
                name="skill"
                min="0"
                max="10">

        </fieldset>


        <br>


        <fieldset>
            <legend>Contact Details</legend>


            <label for="phone">Phone Number:</label><br>
            <input 
                type="tel"
                id="phone"
                name="phone"
                pattern="[0-9]{10}"
                placeholder="Enter 10 digit mobile number"
                required>

        </fieldset>


        <br>


        <input type="submit" value="Register">

        <input type="reset" value="Clear">


    </form>

</body>

</html>
